{% extends 'base.html' %}

{% block title %}{{ titulo }} | Polo-Fitness{% endblock %}

{% block content %}
    <h1>{{ titulo }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Salvar</button>
    </form>
    <p><a href="javascript:history.back()">Cancelar</a></p>
{% endblock %}
