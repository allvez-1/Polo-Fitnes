{% extends 'base.html' %}

{% block content %}

<h1>{{ titulo }}</h1>

<p>
    <a href="{% url criar_url %}">
        Novo cadastro
    </a>
</p>

<button type="button" onclick="mostrarLista()">
    Listar
</button>


<div id="listagem" style="display: none;">

    {% if objetos %}

        <ul>

            {% for objeto in objetos %}

                <li>

                    {{ objeto }}

                    <a href="{% url editar_url objeto.pk %}">
                        Editar
                    </a>

                    <a href="{% url excluir_url objeto.pk %}">
                        Excluir
                    </a>

                </li>

            {% endfor %}

        </ul>

    {% else %}

        <p>
            Nenhum registro cadastrado.
        </p>

    {% endif %}

</div>


<script>

function mostrarLista() {

    const lista = document.getElementById('listagem');

    if (lista.style.display === 'none') {
        lista.style.display = 'block';
    } else {
        lista.style.display = 'none';
    }

}

</script>

{% endblock %}
